name: cloudpulse

# Local development topology. Single broker (RF=1) and single-node stores:
# not durable against disk loss and not representative of production capacity.
# Memory limits keep the `core` profile under ~3.5 GB on a developer laptop.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    profiles: [core]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      CLOUDPULSE_MIGRATOR_PASSWORD: ${CLOUDPULSE_MIGRATOR_PASSWORD:-migrator}
      CLOUDPULSE_API_PASSWORD: ${CLOUDPULSE_API_PASSWORD:-api}
      CLOUDPULSE_WORKER_PASSWORD: ${CLOUDPULSE_WORKER_PASSWORD:-worker}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports: ['${CP_POSTGRES_PORT:-15432}:5432']
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cloudpulse']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *default-logging

  redpanda:
    profiles: [core]
    image: redpandadata/redpanda:v26.1.20
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - '19092:19092'
      - '18081:18081'
      - '${CP_REDPANDA_ADMIN_PORT:-19644}:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    logging: *default-logging

  redis:
    profiles: [core]
    image: redis:8.8.4-alpine
    command:
      ['redis-server', '--maxmemory', '96mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports: ['${CP_REDIS_PORT:-16379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    logging: *default-logging

  clickhouse:
    profiles: [core]
    image: clickhouse/clickhouse-server:26.8.36-alpine
    environment:
      CLICKHOUSE_DB: cloudpulse
      CLICKHOUSE_USER: cloudpulse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cloudpulse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '${CP_CLICKHOUSE_HTTP_PORT:-18123}:8123'
      - '${CP_CLICKHOUSE_NATIVE_PORT:-19000}:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1536m
    logging: *default-logging

  redpanda-console:
    profiles: [tools]
    image: redpandadata/console:v3.14.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: 'true'
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ['8080:8080']
    depends_on:
      redpanda: { condition: service_healthy }
    mem_limit: 256m
    logging: *default-logging

  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ../monitoring/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    mem_limit: 256m
    logging: *default-logging

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']
    mem_limit: 384m
    logging: *default-logging

  tempo:
    profiles: [obs]
    image: grafana/tempo:2.10.10
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ../monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['3200:3200']
    mem_limit: 384m
    logging: *default-logging

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ['3001:3000']
    depends_on: [prometheus, tempo]
    mem_limit: 256m
    logging: *default-logging

volumes:
  pg-data:
  redpanda-data:
  clickhouse-data:
  prometheus-data:
  tempo-data:
